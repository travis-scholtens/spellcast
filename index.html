        <link rel="manifest" href="manifest.json">

        <link rel="stylesheet" href="font.css">

          (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
          (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
          m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)

        <script type="text/javascript" src="{APP}.js"></script>
        <script type="text/javascript" src="{WORDS_AM}.js"></script>
        <script type="text/javascript" src="{WORDS_NZ}.js"></script>
        <script type="text/javascript">
          var fontDivWidth;

          document.addEventListener('DOMContentLoaded', function() {
            var fontDiv = document.getElementById('font');
            fontDivWidth = fontDiv.offsetWidth;
            fontDiv.style.fontFamily = 'SpellyFreeMono, serif';

            isFontLoaded();
           });

           function isFontLoaded() {
             if (document.getElementById('font').offsetWidth != fontDivWidth)
               Game.init();
             else
               setTimeout(isFontLoaded, 10);
           }
        </script>
    </head>
    <body style="margin: 0">
        <div id="main" style="position: absolute; width: 100%; height: 100%;"></div>
        <div id="font" style="visibility: hidden; whitespace: nowrap; position: absolute; font-family: serif;">
          lolololololololololololololololololol
        </div>
    </body>
